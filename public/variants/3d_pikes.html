<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Opal - 3D Pikes</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.9);
            --neon: #f472b6;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .ui-overlay {
            position: absolute;
            bottom: 32px;
            left: 32px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 300px;
            z-index: 10;
            color: #fff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .time-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        #time {
            font-size: 42px;
            font-weight: 900;
            color: #22d3ee;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="ui-overlay">
        <div class="time-header">Temporal Pulse</div>
        <div id="time">00:00</div>
        <div class="stats">
            <div>
                <div class="stat-label">Active Flow</div>
                <div id="intensity" class="stat-val">0</div>
            </div>
            <div>
                <div class="stat-label">Peak Station</div>
                <div id="peak" class="stat-val" style="font-size: 13px; margin-top: 8px;">-</div>
            </div>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2hhbm5vbmR1c3NveWUiLCJhIjoiY2oxbmhuM2F6MDBqYjMybWhkbTd6MjdxbyJ9.eJ3subj-fGRIz5ujR0xz8A';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [151.20, -33.86],
            zoom: 12,
            pitch: 65,
            bearing: -20,
            antialias: true
        });

        const parseTime = d3.timeParse("%Y%m%d %H:%M");
        const formatTime = d3.timeFormat("%H:%M");

        d3.csv("/data/d3-data.csv").then(data => {
            const dates = Array.from(new Set(data.map(d => d.datetime))).sort();
            const stationMap = d3.group(data, d => d.datetime);
            let counter = 0;

            map.on('load', () => {
                map.addSource('pikes', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] }
                });

                map.addLayer({
                    'id': 'pikes-3d',
                    'type': 'fill-extrusion',
                    'source': 'pikes',
                    'paint': {
                        'fill-extrusion-color': [
                            'interpolate', ['linear'], ['get', 'count'],
                            0, '#1e1b4b',
                            50, '#4338ca',
                            150, '#d946ef',
                            300, '#fb7185',
                            500, '#ffffff'
                        ],
                        'fill-extrusion-height': ['*', ['get', 'count'], 4], // Subdued height
                        'fill-extrusion-base': 0,
                        'fill-extrusion-opacity': 0.95
                    }
                });

                function update() {
                    const currentTime = dates[counter];
                    const intervalData = stationMap.get(currentTime).filter(d => +d.count > 0);

                    // UI Updates
                    const displayTime = parseTime(currentTime);
                    document.getElementById('time').textContent = formatTime(displayTime);

                    const flow = d3.sum(intervalData, d => +d.count);
                    document.getElementById('intensity').textContent = flow.toLocaleString();

                    if (intervalData.length > 0) {
                        const top = intervalData.reduce((prev, curr) => (+prev.count > +curr.count) ? prev : curr);
                        document.getElementById('peak').textContent = top.loc.replace(" Station", "");
                    }

                    // GeoJSON Generation for slimming pikes
                    const r = 0.0004; // Very slim radius
                    const geojson = {
                        type: 'FeatureCollection',
                        features: intervalData.map(d => {
                            const lon = +d.lon, lat = +d.lat;
                            return {
                                type: 'Feature',
                                properties: { count: +d.count },
                                geometry: {
                                    type: 'Polygon',
                                    coordinates: [[
                                        [lon - r, lat - r], [lon + r, lat - r],
                                        [lon + r, lat + r], [lon - r, lat + r],
                                        [lon - r, lat - r]
                                    ]]
                                }
                            };
                        })
                    };

                    map.getSource('pikes').setData(geojson);
                    counter = (counter + 1) % dates.length;
                    setTimeout(update, 1000);
                }

                update();
            });
        });
    </script>
</body>

</html>
