<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <title>Opal - Neon Pulsar</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --panel: rgba(17, 24, 39, 0.8);
            --accent: #22d3ee;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        svg {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-card {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            width: 280px;
            z-index: 10;
            color: #f8fafc;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .time-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        #time-display {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        .stat-group {
            display: flex;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .stat-item {
            flex: 1;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .legend {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 11px;
            z-index: 10;
        }

        .legend-scale {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .legend-bar {
            width: 100px;
            height: 8px;
            background: linear-gradient(to right, #6366f1, #0ea5e9, #22d3ee, #fff);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="ui-card">
        <div class="time-label">Commute Timeline</div>
        <div id="time-display">00:00</div>
        <div class="stat-group">
            <div class="stat-item">
                <div class="stat-label">Tap-ons</div>
                <div id="total-taps" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Peak Station</div>
                <div id="peak-station" class="stat-value"
                    style="font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</div>
            </div>
        </div>
    </div>

    <div class="legend">
        <div>Activity Intensity</div>
        <div class="legend-scale">
            <span>Low</span>
            <div class="legend-bar"></div>
            <span>High</span>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2hhbm5vbmR1c3NveWUiLCJhIjoiY2oxbmhuM2F6MDBqYjMybWhkbTd6MjdxbyJ9.eJ3subj-fGRIz5ujR0xz8A';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [151.05, -33.86],
            zoom: 9.8,
            pitch: 15
        });

        const parseTime = d3.timeParse("%Y%m%d %H:%M");
        const formatTime = d3.timeFormat("%H:%M");
        const formatFullTime = d3.timeFormat("%a, %H:%M");

        d3.csv("/data/d3-data.csv").then(rawData => {
            // Process data: filter out zero counts and group by time
            const data = rawData.map(d => ({
                loc: d.loc,
                lat: +d.lat,
                lon: +d.lon,
                datetime: d.datetime,
                count: +d.count
            }));

            const dates = Array.from(new Set(data.map(d => d.datetime))).sort();
            const stationMap = d3.group(data, d => d.datetime);

            map.on('load', () => {
                const container = map.getCanvasContainer();
                const svg = d3.select(container).append("svg");
                const defs = svg.append("defs");

                // Glow filter
                const filter = defs.append("filter")
                    .attr("id", "glow")
                    .attr("x", "-50%")
                    .attr("y", "-50%")
                    .attr("width", "200%")
                    .attr("height", "200%");

                filter.append("feGaussianBlur")
                    .attr("stdDeviation", "3.5")
                    .attr("result", "coloredBlur");

                const feMerge = filter.append("feMerge");
                feMerge.append("feMergeNode").attr("in", "coloredBlur");
                feMerge.append("feMergeNode").attr("in", "SourceGraphic");

                const colorScale = d3.scaleSequential()
                    .domain([0, 500])
                    .interpolator(d3.interpolateRgbBasis(["#6366f1", "#0ea5e9", "#22d3ee", "#ffffff"]));


                let index = 0;

                function update() {
                    const currentTime = dates[index];
                    const intervalData = stationMap.get(currentTime).filter(d => d.count > 0);

                    // Update UI
                    const dateObj = parseTime(currentTime);
                    d3.select("#time-display").text(formatTime(dateObj));

                    const totalTaps = d3.sum(intervalData, d => d.count);
                    d3.select("#total-taps").text(totalTaps.toLocaleString());

                    if (intervalData.length > 0) {
                        const peak = intervalData.reduce((prev, current) => (prev.count > current.count) ? prev : current);
                        d3.select("#peak-station").text(peak.loc.replace(" Station", ""));
                    }

                    // Update Map Elements
                    const circles = svg.selectAll(".station-pulse")
                        .data(intervalData, d => d.loc);

                    circles.exit()
                        .transition().duration(500)
                        .attr("r", 0)
                        .attr("opacity", 0)
                        .remove();

                    const enter = circles.enter()
                        .append("circle")
                        .attr("class", "station-pulse")
                        .attr("filter", "url(#glow)")
                        .attr("opacity", 0)
                        .attr("r", 0);

                    enter.merge(circles)
                        .attr("cx", d => map.project([d.lon, d.lat]).x)
                        .attr("cy", d => map.project([d.lon, d.lat]).y)
                        .transition().duration(1000)
                        .attr("r", 8)
                        .attr("fill", d => colorScale(d.count))
                        .attr("opacity", 0.85);

                    index = (index + 1) % dates.length;
                    setTimeout(update, 1000);
                }

                function reposition() {
                    svg.selectAll(".station-pulse")
                        .attr("cx", d => map.project([d.lon, d.lat]).x)
                        .attr("cy", d => map.project([d.lon, d.lat]).y);
                }

                map.on("viewreset", reposition);
                map.on("move", reposition);
                map.on("moveend", reposition);

                update();
            });
        });
    </script>
</body>

</html>
