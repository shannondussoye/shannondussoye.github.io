<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <title>Opal Card Data Visualisation</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --panel: rgba(17, 24, 39, 0.8);
            --accent: #22d3ee;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        svg {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-card {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            width: 280px;
            z-index: 10;
            color: #f8fafc;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .time-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        #time-display {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        .stat-group {
            display: flex;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .stat-item {
            flex: 1;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .legend {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 11px;
            z-index: 10;
        }

        .legend-scale {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .legend-bar {
            width: 100px;
            height: 8px;
            background: linear-gradient(to right, #6366f1, #0ea5e9, #22d3ee, #fff);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="ui-card">
        <div class="time-label">Commute Timeline</div>
        <div id="time-display">00:00</div>
        <div class="stat-group">
            <div class="stat-item">
                <div class="stat-label">Tap-ons</div>
                <div id="total-taps" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Peak Station</div>
                <div id="peak-station" class="stat-value"
                    style="font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</div>
            </div>
        </div>
    </div>

    <div class="legend">
        <div>Activity Intensity</div>
        <div class="legend-scale">
            <span>Low</span>
            <div class="legend-bar"></div>
            <span>High</span>
        </div>
    </div>

    <script src="../js/opal-viz.js"></script>
</body>

</html>
