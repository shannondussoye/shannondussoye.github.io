<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.12.0/mapbox-gl.css' rel='stylesheet'/>
    <style type="text/css">
        html, body, #wrapper {
            width: 100%;
            height: 100%;
            padding: 0px;
            margin: 0px;
        }

        #map {
            position: relative;
            width: 100%;
            height: 100%;
            margin: auto auto;
        }

        svg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            position: absolute;
            top: 15px;
            right: 15px;
            bottom: 500px;
            width: 350px;
            overflow: false;
            background: rgba(255, 255, 255, 0);
            font-family: "Arial";
            padding-left: 10px;
        }

    </style>
    <title>Opal Data Visualisation</title>
</head>
<body>
<div id="wrapper">
    <div id="map"></div>
    <div id='sidebar'>
        <h1>Opal Card Data Viz</h1>
        <div id='time'></div>
    </div>
</div>
<script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.12.0/mapbox-gl.js'></script>
<script type="text/javascript" src="https://d3js.org/d3.v4.js"></script>
<script type="text/javascript" src="../js/opal-viz.js"></script>
</body>
</html>
