<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Australian SA4 Map</title>

    <script type="text/javascript" src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1a202c;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --accent: #4CAF50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: #1a1a1a;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup-tip {
            display: none;
        }

        .mapboxgl-popup-content {
            padding: 14px 18px;
            border-radius: 14px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            color: var(--text-main);
        }

        .popup-title {
            font-weight: 800;
            font-size: 15px;
            color: #1a202c;
            margin-bottom: 2px;
            display: block;
            letter-spacing: -0.01em;
        }

        .popup-value-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #718096;
            font-weight: 600;
            margin-right: 4px;
        }

        .popup-value {
            font-size: 13px;
            color: #4a5568;
            font-weight: 500;
        }

        .map-overlay {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 200px;
            z-index: 1;
        }

        #legend h4 {
            margin: 0 0 12px 0;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            color: #4a5568;
        }

        .legend-key {
            display: inline-block;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            z-index: 1000;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div style="font-size: 13px; font-weight: 600; color: #4a5568;">Loading SA4 Map...</div>
    </div>

    <div id="map"></div>

    <div class='map-overlay' id='legend'>
        <h4>Statistical Scale</h4>
    </div>

    <script>
        const CONFIG = {
            mapboxToken: 'pk.eyJ1Ijoic2hhbm5vbmR1c3NveWUiLCJhIjoiY2oxbmhuM2F6MDBqYjMybWhkbTd6MjdxbyJ9.eJ3subj-fGRIz5ujR0xz8A',
            dataUrl: '/data/2011sa4.geojson',
            mapStyle: 'mapbox://styles/mapbox/dark-v9',
            center: [134.5, -28.5],
            zoom: 3.2,
            colors: ['#edf8fb', '#b2e2e2', '#66c2a4', '#2ca25f', '#006d2c'],
            breaks: [2, 4, 6, 8, 10]
        };

        mapboxgl.accessToken = CONFIG.mapboxToken;
        const map = new mapboxgl.Map({
            container: 'map',
            style: CONFIG.mapStyle,
            center: CONFIG.center,
            zoom: CONFIG.zoom
        });

        map.on('load', () => {
            d3.json(CONFIG.dataUrl).then(data => {
                data.features.forEach(f => {
                    f.properties.avg_score = parseFloat(d3.randomUniform(1, 10)().toFixed(2));
                });

                map.addSource('sa4', { type: 'geojson', data: data });

                map.addLayer({
                    id: 'sa4-fill',
                    type: 'fill',
                    source: 'sa4',
                    paint: {
                        'fill-outline-color': 'rgba(255,255,255,0.1)',
                        'fill-color': {
                            property: 'avg_score',
                            stops: CONFIG.breaks.map((b, i) => [b, CONFIG.colors[i]])
                        },
                        'fill-opacity': 0.8
                    }
                });

                map.addLayer({
                    id: 'sa4-hover',
                    type: 'fill',
                    source: 'sa4',
                    paint: {
                        'fill-outline-color': '#FFF',
                        'fill-color': '#FFF',
                        'fill-opacity': 0.2
                    },
                    filter: ['==', 'SA4_NAME', '']
                });

                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false,
                    offset: 15
                });

                map.on('mousemove', 'sa4-fill', (e) => {
                    map.getCanvas().style.cursor = 'pointer';
                    const props = e.features[0].properties;
                    map.setFilter('sa4-hover', ['==', 'SA4_NAME', props.SA4_NAME]);

                    popup.setLngLat(e.lngLat)
                        .setHTML(`
                            <span class="popup-title">${props.SA4_NAME}</span>
                            <div style="display: flex; align-items: baseline;">
                                <span class="popup-value-label">Score</span>
                                <span class="popup-value">${props.avg_score}</span>
                            </div>
                        `)
                        .addTo(map);
                });

                map.on('mouseleave', 'sa4-fill', () => {
                    map.getCanvas().style.cursor = '';
                    popup.remove();
                    map.setFilter('sa4-hover', ['==', 'SA4_NAME', '']);
                });

                map.on('click', 'sa4-fill', (e) => {
                    const feature = e.features[0];
                    const bounds = new mapboxgl.LngLatBounds();
                    const coords = feature.geometry.type === 'Polygon' ? feature.geometry.coordinates[0] : feature.geometry.coordinates[0][0];
                    coords.forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds, { padding: 50 });
                });

                // Legend
                const legendEl = document.getElementById('legend');
                const labels = ['Low', 'Below Avg', 'Average', 'Above Avg', 'High'];
                labels.forEach((label, i) => {
                    const row = document.createElement('div');
                    row.className = 'legend-row';
                    row.innerHTML = `<span class="legend-key" style="background-color: ${CONFIG.colors[i]}"></span><span>${label}</span>`;
                    legendEl.appendChild(row);
                });

                document.getElementById('loading').style.display = 'none';
            });
        });

        map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    </script>
</body>

</html>
