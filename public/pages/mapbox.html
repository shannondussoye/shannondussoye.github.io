<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'/>
    <title>Show polygon information on click</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no'/>
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.41.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.41.0/mapbox-gl.css' rel='stylesheet'/>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup {
            max-width: 400px;
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        }

        #legend {
            padding: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10);
            line-height: 18px;
            height: 120px;
            margin-bottom: 40px;
            width: 180px;
        }

        .legend-key {
            display: inline-block;
            border-radius: 20%;
            width: 10px;
            height: 10px;
            margin-right: 5px;
        }

        .map-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.8);
            margin-left: 20px;
            font-family: Arial, sans-serif;
            overflow: auto;
            border-radius: 3px;
        }

        .mapboxgl-popup {
            max-width: 400px;
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div id='map'></div>
<div class='map-overlay' id='legend'></div>
<script type="text/javascript" src="https://d3js.org/d3.v4.min.js"></script>
<script>

    var COLORS = ['#91d7ff', '#146ec8', '#0051a7', '#ff9696', '#d7160a', '#b80000'],
        BREAKS = [1, 2, 3, 4, 5, 6],
        FILTERUSE;
    //    var scale = d3.scaleLinear().domain([0, 600000]).range([0, 5]);


    mapboxgl.accessToken = 'pk.eyJ1Ijoibnl0Z3JhcGhpY3MiLCJhIjoiY2o5YTl2N29jMTBsZDM0cDl5NW50MXo5aCJ9.XWVKJju1tz6kSBXkeWJzwg';
    var map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/nytgraphics/cj9ospgyg4lw42rnsd7k0vmxt',
        center: [132, -28],
        zoom: 3.5
    });

    var data = "../data/sa4population.geojson";
    map.on('load', function () {
        // Add a layer showing the state polygons.
        map.addLayer({
            'id': 'sa4-layer',
            'type': 'fill',
            'source': {
                'type': 'geojson',
                'data': data
            },
            'paint': {
                'fill-outline-color': '#FFF',
                'fill-color': {
                    property: 'Tot_P_P',
                    stops: [[50000, '#91d7ff'],
                        [100000, '#146ec8'],
                        [150000, '#0051a7'],
                        [200000, '#ff9696'],
                        [400000, '#d7160a'],
                        [600000, '#b80000']]
                },
                'fill-opacity': 0.9
            }
        });

        map.addLayer({
            'id': 'sa4-hover',
            'type': 'fill',
            'source': 'sa4-layer',
            'layout': {},
            'paint': {
                'fill-outline-color': 'black',
                'fill-color': 'black',
                'fill-opacity': 0.4
            },
            "filter": ["==", "SA4_NAME", ""]

        });

        // Create a popup, but don't add it to the map yet.
        var popup = new mapboxgl.Popup({
            closeButton: false,
            closeOnClick: false
        });

        map.on('mousemove', 'sa4-layer', function (e) {
            // Change the cursor style as a UI indicator.
            map.getCanvas().style.cursor = 'pointer';

            // Populate the popup aand set its coordinates
            // based on the feature found.
            map.setFilter("sa4-hover", ["==", "SA4_NAME", e.features[0].properties.SA4_NAME]);
            popup.setLngLat(e.lngLat)
                .setHTML(e.features[0].properties.SA4_NAME + "<br>" + "Population Size : " + (e.features[0].properties.Tot_P_P).toLocaleString())
                .addTo(map);

        });
        map.on('mouseleave', 'sa4-layer', function () {
            map.getCanvas().style.cursor = '';
            popup.remove();
            map.setFilter("sa4-hover", ["==", "SA4_NAME", ""]);
        });

        var layers = ['0 - 50,000', '50,000 - 100,000', '100,000 - 150,000', '150,000 - 200,000', '200,000 - 400,000', '400,000+'];
        var colors = ['#91d7ff', '#146ec8', '#0051a7', '#ff9696', '#d7160a', '#b80000'];
        for (i = 0; i < layers.length; i++) {
            var layer = layers[i];
            var color = colors[i];
            var item = document.createElement('div');
            var key = document.createElement('span');
            key.className = 'legend-key';
            key.style.backgroundColor = color;

            var value = document.createElement('span');
            value.innerHTML = layer;
            item.appendChild(key);
            item.appendChild(value);
            legend.appendChild(item);
        }


    });
</script>

</body>
</html>
