<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <title>Census 2011 - Australia SA4 Population</title>
    <script src="https://d3js.org/d3.v4.min.js"></script>
    <script src="https://d3js.org/topojson.v1.min.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.41.0/mapbox-gl.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/2.0.2/turf.min.js"></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.41.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1a202c;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Viridis-style color palette */
            --color-1: #440154;
            --color-2: #482878;
            --color-3: #3e4989;
            --color-4: #31688e;
            --color-5: #26828e;
            --color-6: #1f9e89;
            --color-7: #35b779;
            --color-8: #6ece58;
            --color-9: #b5de2b;
            --color-10: #fde725;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: #1a202c;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .mapboxgl-popup-tip {
            display: none;
        }

        .mapboxgl-popup-content {
            padding: 16px 20px;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: var(--text-main);
        }

        .popup-title {
            font-weight: 800;
            font-size: 16px;
            color: #1a202c;
            margin-bottom: 8px;
            display: block;
            letter-spacing: -0.01em;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 6px;
        }

        .popup-stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .popup-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #718096;
            font-weight: 600;
            margin-right: 12px;
        }

        .popup-value {
            font-size: 13px;
            color: #2d3748;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .total-pop {
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .total-pop .popup-value {
            font-size: 15px;
            color: #2b6cb0;
        }

        /* Modern Legend Overlay */
        .map-overlay {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 220px;
            z-index: 1;
        }

        #legend h4 {
            margin: 0 0 12px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            color: #4a5568;
            font-weight: 500;
        }

        .legend-key {
            display: inline-block;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div id='map'></div>
    <div class='map-overlay' id='legend'>
        <h4>Population Density</h4>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2hhbm5vbmR1c3NveWUiLCJhIjoiY2oxbmhuM2F6MDBqYjMybWhkbTd6MjdxbyJ9.eJ3subj-fGRIz5ujR0xz8A';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v9',
            center: [134.5, -28.5],
            zoom: 3.2
        });

        // Viridis Color Scale
        const VIRIDIS = ['#440154', '#482475', '#414487', '#355f8d', '#2a788e', '#21918c', '#22a884', '#44bf70', '#7ad151', '#bddf26', '#fde725'];
        const STEPS = [25000, 50000, 75000, 100000, 125000, 150000, 200000, 300000, 400000, 500000, 600000];

        map.on('load', () => {
            d3.json("../data/sa4population.geojson", (err, sa4) => {
                if (err) throw err;

                map.addSource('sa4', { type: 'geojson', data: sa4 });

                map.addLayer({
                    id: 'sa4',
                    type: 'fill',
                    source: 'sa4',
                    paint: {
                        'fill-outline-color': 'rgba(255,255,255,0.15)',
                        'fill-color': {
                            property: 'Tot_P_P',
                            stops: STEPS.map((s, i) => [s, VIRIDIS[i]])
                        },
                        'fill-opacity': 0.85
                    }
                });

                map.addLayer({
                    id: 'sa4-hover',
                    type: 'fill',
                    source: 'sa4',
                    paint: {
                        'fill-outline-color': '#FFF',
                        'fill-color': '#FFF',
                        'fill-opacity': 0.2
                    },
                    filter: ["==", "SA4_NAME", ""]
                });

                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false,
                    offset: 15
                });

                map.on("mousemove", "sa4", (e) => {
                    map.getCanvas().style.cursor = 'pointer';
                    const props = e.features[0].properties;
                    map.setFilter("sa4-hover", ["==", "SA4_NAME", props.SA4_NAME]);

                    const format = d3.format(",");

                    popup.setLngLat(e.lngLat)
                        .setHTML(`
                            <span class="popup-title">${props.SA4_NAME}</span>
                            <div class="popup-stat total-pop">
                                <span class="popup-label">Total Population</span>
                                <span class="popup-value">${format(props.Tot_P_P)}</span>
                            </div>
                            <div class="popup-stat">
                                <span class="popup-label">Male</span>
                                <span class="popup-value">${format(props.Tot_P_M)}</span>
                            </div>
                            <div class="popup-stat">
                                <span class="popup-label">Female</span>
                                <span class="popup-value">${format(props.Tot_P_F)}</span>
                            </div>
                        `)
                        .addTo(map);
                });

                map.on("mouseleave", "sa4", () => {
                    map.getCanvas().style.cursor = '';
                    popup.remove();
                    map.setFilter("sa4-hover", ["==", "SA4_NAME", ""]);
                });

                // Zoom functionality on click
                let lastClicked = null;
                map.on("click", "sa4", (e) => {
                    const feature = e.features[0];
                    if (lastClicked === feature.properties.SA4_NAME) {
                        map.zoomTo(3.2);
                        map.panTo([134.5, -28.5]);
                        lastClicked = null;
                    } else {
                        const bounds = new mapboxgl.LngLatBounds();
                        const coords = feature.geometry.type === 'Polygon' ? feature.geometry.coordinates[0] : feature.geometry.coordinates[0][0];
                        coords.forEach(coord => bounds.extend(coord));
                        map.fitBounds(bounds, { padding: 50 });
                        lastClicked = feature.properties.SA4_NAME;
                    }
                });

                // Create Legend
                const legendLabels = ['< 25k', '50k', '100k', '150k', '200k', '300k', '400k', '500k', '600k+'];
                const legendColors = [VIRIDIS[0], VIRIDIS[1], VIRIDIS[3], VIRIDIS[5], VIRIDIS[6], VIRIDIS[7], VIRIDIS[8], VIRIDIS[9], VIRIDIS[10]];
                const legendEl = document.getElementById('legend');

                for (var i = 0; i < legendLabels.length; i++) {
                    var item = document.createElement('div');
                    item.className = 'legend-row';
                    var key = document.createElement('span');
                    key.className = 'legend-key';
                    key.style.backgroundColor = legendColors[i];
                    var value = document.createElement('span');
                    value.innerHTML = legendLabels[i];
                    item.appendChild(key);
                    item.appendChild(value);
                    legendEl.appendChild(item);
                }
            });
        });

        map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    </script>
</body>

</html>
